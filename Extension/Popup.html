<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 380px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; margin: 0; padding: 15px; }
        .action-section { display: block; }
        .loading-section { display: none; text-align: center; margin-top: 20px;}
        .result-section { display: none; }

        .btn-blue { background-color: #4285f4; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        .btn-yellow { background-color: #fbbc04; color: #000; padding: 12px; width: 100%; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-red { background-color: #ea4335; color: white; padding: 10px; width: 100%; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        
        .result-card { 
            background-color: #2b281c;
            border: 1px solid #fbbc04; 
            border-radius: 8px; 
            padding: 15px; 
            text-align: center;
        }
        .result-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: #fbbc04; }
        .result-score { font-size: 32px; font-weight: bold; margin: 0 0 15px 0; }
        
        .breakdown { display: flex; justify-content: space-between; font-size: 11px; background-color: #201e15; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .bd-ham { color: #a1a1aa; }
        .bd-spam { color: #a1a1aa; }
        .bd-scam { color: #ea4335; }

        .evidence-box { background-color: #383322; padding: 12px; border-radius: 6px; text-align: left; font-size: 13px; }
        .evidence-title { font-weight: bold; margin-bottom: 8px; color: #d4d4d8; }
        .evidence-list { margin: 0; padding-left: 20px; color: #d4d4d8; }
        .evidence-list li { margin-bottom: 4px; }
        
        .llama-insight { color: #d7aefb; font-weight: bold; font-style: italic; list-style-type: none; border-left: 3px solid #af5cf6; padding-left: 8px; margin-left: -15px;}

        .btn-whitelist { background-color: #10b981; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px; }

        .mode-desc {
            font-size: 10px;
            color: #a1a1aa;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 10px;
        }

        .result-mode-badge {
            display: inline-block;
            background: #0F3460;
            color: #FFB085;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .sensitivity-control {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        .sensitivity-control label {
            font-size: 11px;
            color: #9ca3af;
            display: block;
            margin-bottom: 8px;
        }
        .sens-btn {
            flex: 1;
            padding: 6px;
            font-size: 10px;
            background: #3c4043;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .sens-btn.active {
            background: #4285f4;
            font-weight: bold;
        }

        .feedback-section {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #333;
            text-align: center;
        }
        .feedback-section span {
            font-size: 11px;
            color: #9ca3af;
        }
        .btn-fb {
            background-color: #3c4043;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px 3px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-fb:hover {
            background-color: #5f6368;
        }

        /* User info bar */
        #user-info-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px;
            background: #2d2d2d;
            border-radius: 6px;
        }
        #user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #8ab4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }
        #user-email-display {
            font-size: 12px;
            color: #ccc;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #btn-logout, #btn-login-inline {
            background: none;
            border: 1px solid #555;
            color: #ccc;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="action-section" class="action-section">
        <!-- User info bar -->
        <div id="user-info-bar">
            <div id="user-avatar">?</div>
            <span id="user-email-display">Chưa đăng nhập</span>
            <button id="btn-logout" style="display:none;">Đăng xuất</button>
            <button id="btn-login-inline" style="display:none;">Đăng nhập</button>
        </div>

        <div style="text-align: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <h3 style="margin:0; color:#8ab4f8;"><img src="data:image/png;base64,..." style="width:18px;height:18px;vertical-align:middle;margin-right:4px;"> SpamShield AI</h3>
        </div>
        <!-- Phần còn lại giữ nguyên như code cũ -->
        <div style="font-size: 11px; color:#9ca3af; margin-bottom: 5px;">BẢN THƯỜNG</div>
        <button id="btn-standard" class="btn-blue">⚡ Quét Nhanh (Ham / Scam)</button>
        <div class="mode-desc">🚀 FastText – phân loại siêu tốc</div>

        <div style="font-size: 11px; color:#9ca3af; margin-bottom: 5px; margin-top: 15px;">BẢN PRO <span style="background:#fbbc04; color:#000; padding:2px 4px; border-radius:3px;">PRO</span></div>
        <button id="btn-pro" class="btn-yellow">✨ Quét Chuyên Sâu (ViBert)</button>
        <div class="mode-desc" style="margin-top: 25px;">🧠 ViBERTa + Groq (Llama 3.1) – Teacher-Student</div>

        <div class="sensitivity-control">
            <label>🎚️ Độ nhạy phát hiện lừa đảo</label>
            <div id="sensitivity-options" style="display:flex; gap:5px;">
                <button class="sens-btn" data-mode="relaxed">🕊️ Nhẹ nhàng</button>
                <button class="sens-btn active" data-mode="balanced">⚖️ Cân bằng</button>
                <button class="sens-btn" data-mode="strict">🛡️ Bảo vệ cao</button>
            </div>
            <div style="font-size:9px; color:#9ca3af; margin-top:4px; text-align:center;" id="sens-description">Cảnh báo hầu hết email đáng ngờ (mặc định)</div>
        </div>

        <button id="btn-history" class="btn-blue" style="margin-top: 15px; background-color: #6c5ce7;">📋 Xem lịch sử quét</button>
        <button id="btn-manage-lists" class="btn-blue" style="margin-top: 10px; background-color: #8e44ad;">🔒 Quản lý Whitelist/Blacklist</button>
    </div>

    <div id="loading-section" class="loading-section">
        <h3 style="color:#8ab4f8;">⏳ Đang phân tích ngữ cảnh...</h3>
        <button id="btn-stop" class="btn-red">🛑 Dừng quét ngay</button>
    </div>

    <div id="result-section" class="result-section">
        <!-- ... giữ nguyên phần result ... -->
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
