<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SpamShield AI - Đăng nhập</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #252525;
            padding: 40px;
            border-radius: 16px;
            width: 460px;
            text-align: center;
        }
        h2 { color: #8ab4f8; margin-bottom: 28px; font-size: 24px; }
        .tab-buttons {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid #333;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.3s, border-bottom 0.3s;
        }
        .tab-btn.active {
            color: #8ab4f8;
            border-bottom: 2px solid #8ab4f8;
            font-weight: bold;
        }
        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 12px;
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            color: white;
            gap: 12px;
            background: #2f2f2f;
            border: 1px solid #555;
            transition: background 0.2s, border-color 0.2s;
        }
        .social-btn:hover {
            background: #3a3a3a;
            border-color: #888;
        }
        .social-icon { width: 26px; height: 26px; }
        .divider { margin: 24px 0; color: #9ca3af; font-size: 13px; }

        .input-group {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }
        .input-group .input-field {
            width: 100%;
            padding: 12px 14px;
            padding-right: 60px;
            border: 1px solid #555;
            border-radius: 6px;
            background: #1e1e1e;
            color: #fff;
            font-size: 15px;
        }
        .input-group .toggle-pwd {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 1px solid #555;
            border-radius: 4px;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            padding: 2px 8px;
            line-height: 1.4;
            transition: 0.2s;
        }
        .input-group .toggle-pwd:hover {
            background: #3a3a3a;
            border-color: #888;
            color: #fff;
        }

        .submit-btn {
            background: #10b981;
            color: white;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 12px;
        }
        .submit-btn:hover { opacity: 0.9; }

        .error-msg { color: #ea4335; font-size: 13px; margin-top: 6px; display: none; }
        .success-msg { color: #10b981; font-size: 13px; margin-top: 6px; display: none; }
        .code-section { display: none; margin-top: 14px; }
        .forgot-link { color: #8ab4f8; font-size: 13px; text-decoration: none; cursor: pointer; }
        .forgot-link:hover { text-decoration: underline; }
        .password-hint {
            font-size: 12px;
            color: #9ca3af;
            text-align: left;
            margin: -5px 0 10px 4px;
        }
        .debug-area { margin-top: 20px; text-align: left; }
        .debug-area textarea {
            width: 100%;
            background: #1e1e1e;
            color: #aaa;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            font-size: 11px;
            display: none;
            resize: vertical;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>🛡️ SpamShield AI</h2>

    <div class="tab-buttons">
        <button class="tab-btn active" data-tab="login">Đăng nhập</button>
        <button class="tab-btn" data-tab="register">Đăng ký</button>
    </div>

    <!-- ========== PANEL ĐĂNG NHẬP ========== -->
    <div id="login-panel" class="form-panel active">
        <button class="social-btn" id="google-login">
            <span class="social-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="26" height="26">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.985 23.985 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.97-5.97z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/>
                </svg>
            </span>
            Đăng nhập với Google
        </button>

        <div class="divider">— HOẶC —</div>

        <div class="input-group">
            <input type="email" class="input-field" id="login-email" placeholder="Email">
        </div>
        <div class="input-group">
            <input type="password" class="input-field" id="login-password" placeholder="Mật khẩu">
            <button type="button" class="toggle-pwd" data-target="login-password">Hiện</button>
        </div>
        <button class="submit-btn" id="email-login-btn">Đăng nhập</button>
        <div class="error-msg" id="login-error"></div>
        <div class="success-msg" id="login-success"></div>
        <div style="text-align:right; margin-top:8px;">
            <span class="forgot-link" id="forgot-link">Quên mật khẩu?</span>
        </div>
    </div>

    <!-- ========== PANEL ĐĂNG KÝ ========== -->
    <div id="register-panel" class="form-panel">
        <div class="input-group">
            <input type="email" class="input-field" id="reg-email" placeholder="Email">
        </div>
        <div class="input-group">
            <input type="password" class="input-field" id="reg-password" placeholder="Mật khẩu">
            <button type="button" class="toggle-pwd" data-target="reg-password">Hiện</button>
        </div>
        <div class="password-hint">
            Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt.
        </div>
        <button class="submit-btn" id="register-btn">Đăng ký</button>
        <div class="error-msg" id="reg-error"></div>
        <div class="success-msg" id="reg-success"></div>

        <div class="code-section" id="code-section">
            <div class="input-group">
                <input type="text" class="input-field" id="confirm-code" placeholder="Nhập mã xác nhận từ email">
            </div>
            <button class="submit-btn" id="confirm-btn">Xác nhận</button>
            <div class="error-msg" id="confirm-error"></div>
            <div class="success-msg" id="confirm-success"></div>
        </div>
    </div>

    <!-- ========== PANEL QUÊN MẬT KHẨU ========== -->
    <div id="forgot-panel" class="form-panel" style="display:none;">
        <h3 style="color:#8ab4f8; margin-bottom:15px;">Quên mật khẩu</h3>
        <div id="forgot-step-1">
            <div class="input-group">
                <input type="email" class="input-field" id="forgot-email" placeholder="Email đã đăng ký">
            </div>
            <button class="submit-btn" id="forgot-send-btn">Gửi mã xác nhận</button>
            <div class="error-msg" id="forgot-error"></div>
            <div class="success-msg" id="forgot-success"></div>
        </div>
        <div id="forgot-step-2" style="display:none;">
            <div class="input-group">
                <input type="text" class="input-field" id="forgot-code" placeholder="Nhập mã xác nhận">
            </div>
            <div class="input-group">
                <input type="password" class="input-field" id="forgot-new-password" placeholder="Mật khẩu mới">
                <button type="button" class="toggle-pwd" data-target="forgot-new-password">Hiện</button>
            </div>
            <div class="input-group">
                <input type="password" class="input-field" id="forgot-confirm-password" placeholder="Xác nhận mật khẩu">
                <button type="button" class="toggle-pwd" data-target="forgot-confirm-password">Hiện</button>
            </div>
            <div class="password-hint">
                Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt.
            </div>
            <button class="submit-btn" id="forgot-reset-btn">Đặt lại mật khẩu</button>
            <div class="error-msg" id="forgot-reset-error"></div>
            <div class="success-msg" id="forgot-reset-success"></div>
        </div>
        <button class="submit-btn" style="background:#555; margin-top:10px;" id="forgot-back-btn">Quay lại đăng nhập</button>
    </div>

    <!-- ========== DEBUG ========== -->
    <div class="debug-area">
        <textarea id="debug-url" rows="3" readonly placeholder="URL debug"></textarea>
    </div>
</div>

<script src="env.js"></script>
<script src="login.js"></script>
</body>
</html>
