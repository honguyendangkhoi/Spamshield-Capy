<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SpamShield AI - Đăng nhập</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #252525;
            padding: 40px;                     
            border-radius: 16px;               
            width: 460px;                      
            text-align: center;
        }
        h2 { color: #8ab4f8; margin-bottom: 28px; font-size: 24px; }
        .tab-buttons {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid #333;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;                    
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 16px;                  
            cursor: pointer;
            transition: color 0.3s, border-bottom 0.3s;
        }
        .tab-btn.active {
            color: #8ab4f8;
            border-bottom: 2px solid #8ab4f8;
            font-weight: bold;
        }
        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 12px;               
            margin: 12px 0;
            border: none;
            border-radius: 8px;
            font-size: 15px;                  
            cursor: pointer;
            color: white;
            gap: 12px;
            background: #2f2f2f;
            border: 1px solid #555;
            transition: background 0.2s, border-color 0.2s;
        }
        .social-btn:hover {
            background: #3a3a3a;
            border-color: #888;
        }

        .social-icon {
            width: 26px;                      
            height: 26px;
        }
        .divider { margin: 24px 0; color: #9ca3af; font-size: 13px; }
        .input-field {
            width: 100%;
            padding: 12px 14px;               
            margin: 10px 0;
            border: 1px solid #555;
            border-radius: 6px;
            background: #1e1e1e;
            color: #fff;
            font-size: 15px;                  
        }
        .submit-btn {
            background: #10b981;
            color: white;
            padding: 14px;                    
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;                  
            margin-top: 12px;
        }
        .error-msg { color: #ea4335; font-size: 13px; margin-top: 6px; display: none; }
        .success-msg { color: #10b981; font-size: 13px; margin-top: 6px; display: none; }
        .code-section { display: none; margin-top: 14px; }
    </style>
</head>

        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="login">Đăng nhập</button>
            <button class="tab-btn" data-tab="register">Đăng ký</button>
        </div>

        <!-- PANEL ĐĂNG NHẬP -->
        <div id="login-panel" class="form-panel active">
            <button class="social-btn google-btn" id="google-login">
                <span class="social-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="26" height="26">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

                    </svg>
                </span>
                Đăng nhập với Google
            </button>
            <button class="social-btn microsoft-btn" id="microsoft-login">
                <span class="social-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="26" height="26">
                        <rect x="6" y="6" width="16" height="16" fill="#F25022" rx="2"/>
                        <rect x="26" y="6" width="16" height="16" fill="#7FBA00" rx="2"/>
                        <rect x="6" y="26" width="16" height="16" fill="#00A4EF" rx="2"/>
                        <rect x="26" y="26" width="16" height="16" fill="#FFB900" rx="2"/>
                    </svg>
                </span>
                Đăng nhập với Microsoft
            </button>

            <div class="divider">— HOẶC —</div>

            <input type="email" class="input-field" id="login-email" placeholder="Email">
            <input type="password" class="input-field" id="login-password" placeholder="Mật khẩu">
            <button class="submit-btn" id="email-login-btn">Đăng nhập</button>
            <div class="error-msg" id="login-error"></div>
            <div class="success-msg" id="login-success"></div>
        </div>

        <!-- PANEL ĐĂNG KÝ -->
        <div id="register-panel" class="form-panel">
            <input type="email" class="input-field" id="reg-email" placeholder="Email">
            <input type="password" class="input-field" id="reg-password" placeholder="Mật khẩu">
            <button class="submit-btn" id="register-btn">Đăng ký</button>
            <div class="error-msg" id="reg-error"></div>
            <div class="success-msg" id="reg-success"></div>

            <div class="code-section" id="code-section">
                <input type="text" class="input-field" id="confirm-code" placeholder="Nhập mã xác nhận từ email">
                <button class="submit-btn" id="confirm-btn">Xác nhận</button>
                <div class="error-msg" id="confirm-error"></div>
                <div class="success-msg" id="confirm-success"></div>
            </div>
        </div>
    </div>

    <script src="env.js"></script>
    <script src="login.js"></script>
</body>
</html>
